# Copia este archivo a .streamlit/secrets.toml y llena lo que necesites.
# secrets.toml está en .gitignore: NUNCA se sube al repo.
#
# En Streamlit Community Cloud no se sube ningún archivo: se pega este mismo
# contenido en Manage app → Settings → Secrets.

# ── Agente IA (módulo 12) ────────────────────────────────────────────────────
# Con esto configurado, el panel no le pide la llave a nadie: el agente queda
# conectado a Claude directamente. Sin esto, el módulo funciona en modo demo.
# La llave se saca en https://console.anthropic.com → API Keys
ANTHROPIC_API_KEY = "sk-ant-..."

# Opcional: modelo del agente. Por defecto claude-sonnet-5.
# ANTHROPIC_MODEL = "claude-sonnet-5"
